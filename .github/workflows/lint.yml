name: Lint

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 5.0-dev
  pull_request:
    branches:
      - master
      - 5.0-dev

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: "actions/checkout@v6"

      - name: Set up Python
        uses: "actions/setup-python@v7"
        with:
          # .ruff.toml targets py314. Ruff itself does not run the code.
          python-version: "3.14"

      - name: Install Ruff
        # Pinned, same as requirements_dev.txt. A new Ruff release can add or
        # change rules, so bump it on purpose in its own PR.
        run: pip install "ruff==0.17.0"

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

# Pylint and Mypy are not run here. They need the Home Assistant core checkout
# in .ha-core, which only the devcontainer has. See docs/development.md.
