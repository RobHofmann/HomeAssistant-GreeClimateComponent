[pytest]
# The component is not an installed package, so the tests need a path to import
# it from. They import the protocol layer as a top level "aiogree" package.
#
# Importing it as "gree_custom.aiogree" would run
# custom_components/gree_custom/__init__.py first, and that file imports Home
# Assistant. The protocol layer itself imports nothing from Home Assistant, so
# pointing at the component folder keeps the test run small and fast.
#
# The logger names follow the import, so they are "aiogree.*" here and
# "custom_components.gree_custom.aiogree.*" inside Home Assistant.
pythonpath = custom_components/gree_custom
testpaths = tests

# Async tests need no marker. Home Assistant's own test suite uses the same
# setting, and pytest-homeassistant-custom-component requires it.
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# A test talks to a socket that may go quiet, so a broken test could hang the
# whole run. The slowest test today takes about 8 seconds.
timeout = 60

filterwarnings =
    error
    # asyncio_dgram closes its socket in __del__. When the garbage collector
    # gets there after the event loop of a test is already gone, that raises
    # "Event loop is closed" into the unraisable hook. It says nothing about
    # the code under test.
    ignore::pytest.PytestUnraisableExceptionWarning
